  # ─── bus (ADR-0016 EventBus / Cross-System Communication) ─────────────────
  - id: TR-bus-001
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "Type-safe pub/sub via std::type_index routing: Subscribe<T>(cb) → EventHandle, Unsubscribe, Fire<T>, Queue<T>, DispatchQueued, Clear. One singleton bus, no siblings."
    status: active
    added: 2026-04-17
    revised: ""

  - id: TR-bus-002
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "Handler categorisation: Subscribe<T>(cb, HandlerCategory) with Idempotent and SideEffect; one-arg Subscribe defaults to SideEffect."
    status: active
    added: 2026-04-17
    revised: ""

  - id: TR-bus-003
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "Replay-suppression: SetReplayMode(bool) / IsReplayMode() — SideEffect handlers skipped in replay, Idempotent handlers run; Queue during replay is a no-op. Lifts ADR-0013 §13 forward-declaration."
    status: active
    added: 2026-04-17
    revised: ""

  - id: TR-bus-004
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "Threading: Subscribe/Unsubscribe/Fire/DispatchQueued/Clear are main-thread-only. Worker threads use QueueFromWorker<T> SPSC lane only. Fire from worker is a forbidden pattern."
    status: active
    added: 2026-04-17
    revised: ""

  - id: TR-bus-005
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "AnimationEventDispatcher → global bus bridge via SetGlobalBusBridge(bool); bridged events emit AnimationEventFired on the global bus and respect categorisation."
    status: active
    added: 2026-04-17
    revised: ""

  - id: TR-bus-006
    system: bus
    source_adr: docs/architecture/adr-0016-eventbus.md
    requirement: "Dispatch order = insertion order within handler vector; copy-before-iterate for re-entrancy safety; deterministic under rollback re-simulation."
    status: active
    added: 2026-04-17
    revised: ""

