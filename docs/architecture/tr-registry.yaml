  # ─── rnd (ADR-0002 DX12 backend) ──────────────────────────────────────────
  - id: TR-rnd-001
    system: rnd
    source_adr: docs/architecture/adr-0002-dx12-backend-choice.md
    requirement: "60 fps at 1080p on mid-range consumer hardware with the full Phase 5 feature set enabled."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-rnd-002
    system: rnd
    source_adr: docs/architecture/adr-0002-dx12-backend-choice.md
    requirement: "Support HDR10 / scRGB output, VRS Tier 1 and Tier 2, Mesh Shader pipeline, Sampler Feedback, DirectStorage, and DXR 1.1 where hardware allows."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-rnd-003
    system: rnd
    source_adr: docs/architecture/adr-0002-dx12-backend-choice.md
    requirement: "Deferred + Forward+ hybrid rendering pipeline (Deferred default; Forward+ opt-in for transparency)."
    status: active
    added: 2026-04-15
    revised: ""
    notes: "Partial coverage in ADR-0002; dedicated Rendering Pipeline ADR recommended."

  - id: TR-rnd-004
    system: rnd
    source_adr: docs/architecture/adr-0002-dx12-backend-choice.md
    requirement: "Graceful feature fallback when hardware lacks a capability, gated on runtime gx::GraphicsCaps."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-rnd-005
    system: rnd
    source_adr: docs/architecture/adr-0002-dx12-backend-choice.md
    requirement: "Keep DX12 / DXGI types out of public GXLib headers; use forward-declared opaque handles."
    status: active
    added: 2026-04-15
    revised: ""

  # ─── api (ADR-0003 DXLib compat API layer) ────────────────────────────────
  - id: TR-api-001
    system: api
    source_adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    requirement: "A DXLib program must port to GXLib by changing #include and adding gx:: namespace qualification — no algorithmic rewrite required for the most-used DXLib functions."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-api-002
    system: api
    source_adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    requirement: "Compat functions return int following DXLib convention: 0 = success, -1 = failure; no exceptions across the Compat boundary."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-api-003
    system: api
    source_adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    requirement: "Procedural Compat API and class-style API (gx::App) must coexist over the same underlying engine."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-api-004
    system: api
    source_adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    requirement: "GXLib-exclusive features (HDR, VRS, PostFX) must be reachable from the procedural layer via GXLib-only functions (e.g., SetPostFXMask, EnableHDROutput) without breaking DXLib-shaped calls."
    status: active
    added: 2026-04-15
    revised: ""

  # ─── ecs (ADR-0004 Archetype-based ECS) ───────────────────────────────────
  - id: TR-ecs-001
    system: ecs
    source_adr: docs/architecture/adr-0004-ecs-architecture.md
    requirement: "Handle 100k live entities at 60 fps with component-access latency ≤ 2 ms per frame on a mid-range CPU."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-ecs-002
    system: ecs
    source_adr: docs/architecture/adr-0004-ecs-architecture.md
    requirement: "Support runtime component composition — entities can gain or lose components without respawning."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-ecs-003
    system: ecs
    source_adr: docs/architecture/adr-0004-ecs-architecture.md
    requirement: "Provide query iteration filtered by component set: World::Query<Cs...>()."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-ecs-004
    system: ecs
    source_adr: docs/architecture/adr-0004-ecs-architecture.md
    requirement: "Bridge OOP Node and ECS Entity: Transform (required) and Lifetime/Tag (optional) are mirrored once per frame via EntityBridge."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-ecs-005
    system: ecs
    source_adr: docs/architecture/adr-0004-ecs-architecture.md
    requirement: "Lua scripts must be able to spawn/destroy entities and run queries via gxlib.world."
    status: active
    added: 2026-04-15
    revised: ""

  # ─── scr (ADR-0005 Lua scripting boundary) ────────────────────────────────
  - id: TR-scr-001
    system: scr
    source_adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    requirement: "Scripts are hot-reloadable without invalidating C++-held Lua references (generation-counted callbacks)."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-scr-002
    system: scr
    source_adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    requirement: "Untrusted mod code runs sandboxed: no os.execute / io.open arbitrary paths / package.loadlib / dofile / loadfile; gxlib.io is path-restricted to the script asset root."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-scr-003
    system: scr
    source_adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    requirement: "Lua→C++ trivial bound function call overhead ≤ 1 μs averaged; full ECS query from script ≤ 20 μs."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-scr-004
    system: scr
    source_adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    requirement: "Deterministic call cost — no JIT warm-up stalls or unpredictable GC pauses in the gameplay loop."
    status: active
    added: 2026-04-15
    revised: ""

  - id: TR-scr-005
    system: scr
    source_adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    requirement: "C++ types are script-visible only via explicit sol::usertype<T> registration; GraphicsDevice, archetype internals, and detail:: types are never bound."
    status: active
    added: 2026-04-15
    revised: ""

