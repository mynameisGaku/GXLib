# Technical Requirement ID Registry
#
# PURPOSE: Persistent, stable IDs for every architectural requirement.
# (This project is ADR-only per ADR-0001; requirements are sourced from ADRs
# rather than GDDs. Format otherwise matches the template.)
#
# RULES:
#   - IDs are PERMANENT. Never renumber, never delete (use status: deprecated).
#   - Add new entries only at the END of each system's list.
#   - When a requirement is reworded (same intent): update `requirement` text
#     and add a `revised` date. The ID stays the same.
#   - When a requirement is removed: set status: deprecated.
#   - When a requirement is split or replaced: set status: superseded-by.
#
# WRITTEN BY: /architecture-review (appends new entries, never overwrites)
# READ BY:    /create-stories, /story-done, /story-readiness
#
# ID FORMAT: TR-[system-slug]-[NNN]
#
# STATUS VALUES: active | deprecated | superseded-by: TR-[system]-NNN

version: 3
