# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: new_gdd_authoring
    status: active
    description: "Do not author new files under design/gdd/ for core GXLib subsystems. GXLib is an SDK; architectural decisions are recorded as ADRs only."
    why: "GDD vocabulary and structure are game-design artifacts. Applying them to API/engine design produces low-value duplication of Doxygen content and forces mismatched concepts (Player Fantasy, Tuning Knobs) onto SDK work. Exception: sample games under sdk/ or examples/ may use their own design/gdd/ tree."
    adr: docs/architecture/adr-0001-documentation-strategy.md
    added: 2026-04-15

  - pattern: dx12_type_in_public_header
    status: active
    description: "Public GXLib headers (anything a consumer of the library might #include) must not expose D3D12 / DXGI types. Use forward-declared opaque handles (gx::TextureHandle etc.). <d3d12.h> and <dxgi*.h> stay behind the Graphics/Device/ boundary."
    why: "Leaking backend types forces consumers to include the Windows SDK's DX12 headers, couples game code to a specific DX12 version, and breaks the DXLib-compatible procedural API's promise of simplicity."
    adr: docs/architecture/adr-0002-dx12-backend-choice.md
    added: 2026-04-15

  - pattern: unchecked_optional_gpu_feature
    status: active
    description: "Optional DX12 features (VRS, Mesh Shaders, Sampler Feedback, DirectStorage, DXR) must be gated on gx::GraphicsCaps at runtime. Never assume the feature is available — always check and provide a fallback path."
    why: "Consumer GPUs vary widely in feature support. Assuming Mesh Shaders or DirectStorage availability will crash or silently misrender on minimum-spec hardware (older GTX 10-series, RX 400/500, systems without NVMe)."
    adr: docs/architecture/adr-0002-dx12-backend-choice.md
    added: 2026-04-15

  - pattern: global_namespace_compat_symbol
    status: active
    description: "Compat layer functions (DXLib-shaped procedural API) must be declared inside namespace gx. Never export DrawGraph/DrawString/LoadGraph/etc. in the global namespace, and never use DXLib's exact system names (DxLib_Init, DxLib_End)."
    why: "Global-namespace symbols create ODR clashes when a user links both DxLib and GXLib during a porting transition. Namespace-scoped symbols also make call-site intent explicit in code review (gx::DrawGraph vs DrawGraph)."
    adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    added: 2026-04-15

  - pattern: virtual_or_inherited_ecs_component
    status: active
    description: "ECS components (types stored in ComponentStorage) must be flat POD-like structs. No virtual methods, no base classes, no inheritance hierarchies. Behaviour belongs in Systems, not Components."
    why: "Virtual dispatch kills the SoA cache-locality benefit that archetype ECS exists to provide. Inheritance forces indirection or slicing, and breaks the assumption that a ComponentStorage<T> is a tight contiguous array of T."
    adr: docs/architecture/adr-0004-ecs-architecture.md
    added: 2026-04-15

  - pattern: mid_query_structural_change
    status: active
    description: "Do not add, remove, or destroy entities/components synchronously while iterating a Query. Enqueue the change on the World's command buffer; the buffer flushes between systems, not mid-system."
    why: "Structural changes during iteration invalidate archetype rows and iterators, causing use-after-free or skipped entities. Deferring via command buffer preserves archetype invariants and keeps the ECS hot path branch-free."
    adr: docs/architecture/adr-0004-ecs-architecture.md
    added: 2026-04-15

  - pattern: lua_sandbox_escape
    status: active
    description: "Scripts must not have access to os.execute, os.remove, os.rename, os.exit, io.open, io.popen, io.tmpfile, package.loadlib, package.cpath, dofile, or loadfile. File I/O goes through the path-restricted gxlib.io, which refuses to read outside the configured per-script asset root."
    why: "Untrusted mod code running in end-user shipped builds must not be able to execute arbitrary processes, read/write arbitrary files, or load native DLLs. An explicit allowlist (not denylist) is required; new Lua versions may introduce new unsafe functions that must be reviewed on every Lua bump."
    adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    added: 2026-04-15

  - pattern: unregistered_script_binding_leak
    status: active
    description: "A C++ type becomes script-visible only via an explicit sol::usertype<T> registration in GXLib/Script/ScriptBindings.cpp. Do not return raw engine-internal types (GraphicsDevice, ID3D12Device, archetype internals, anything under detail::) from bound functions, and do not use sol::stack push on them."
    why: "Accidental exposure of engine internals gives scripts (including untrusted mods) a path to bypass the curated gxlib.* facade, break engine invariants, or reach forbidden APIs. Explicit-only binding also means C++ internal refactors don't silently alter the script surface."
    adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    added: 2026-04-15

  - pattern: raw_thread_spawn_in_subsystem
    status: active
    description: "Subsystem code must not spawn its own std::thread / std::jthread / CreateThread. All parallel work goes through gx::JobSystem::Submit / SubmitAfter / ParallelFor / SubmitMainThread."
    why: "Private thread pools cause oversubscription when 5+ subsystems each create their own, defeat the shared scheduler's load balancing, and make priority/shutdown behaviour incoherent across the engine."
    adr: docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15

  - pattern: lua_state_cross_thread
    status: active
    description: "A sol::state / lua_State must be touched only from the thread that owns it (typically the main thread). Cross-thread Lua work goes through JobSystem::SubmitMainThread, not a worker-thread Submit."
    why: "Lua 5.4 states are not thread-safe. Touching a state from multiple threads corrupts the VM silently. Routing through the main-thread queue preserves the single-state-per-thread invariant required by ADR-0005."
    adr: docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15

  - pattern: command_queue_submit_off_main_thread
    status: active
    description: "Submission to ID3D12CommandQueue (ExecuteCommandLists, Signal, Wait on fence from CPU) must happen on the main thread, via JobSystem::SubmitMainThread if originating on a worker. Command list recording (per worker) is fine; submission is main-thread-only."
    why: "DX12 command queues are thread-safe in the sense that the API doesn't crash under concurrent submit, but frame pacing, swap-chain Present, and fence signalling require a serialised order that the main thread authoritatively controls. Submitting from workers breaks presentation ordering and interacts badly with DXGI's flip-model swap chain."
    adr: docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15

  - pattern: hardcoded_filesystem_path
    status: active
    description: "Do not hardcode filesystem paths (absolute or relative) in source code to load assets. Every asset access goes through an AssetId — ideally from a typed constant in a generated per-game asset-ID header, or constructed from a manifest-driven logical path. No fopen / CreateFile / std::ifstream on user-authored paths in gameplay code."
    why: "Hardcoded paths couple source to on-disk layout, break when shipping repackages assets into .pak / .gxa archives, prevent mod remapping via AssetRemapper, and cannot participate in hot reload. AssetId-based access decouples all of this — rename, repackage, and mod without touching code."
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15

  - pattern: subsystem_direct_file_io
    status: active
    description: "Subsystem code (Graphics, Audio, ECS, etc.) must not open files directly via fopen / CreateFile / std::ifstream / ReadFile for asset loading. All asset bytes flow through AssetDatabase / AsyncLoader / the IFileProvider chain. Logging, crash dumps, and user-facing config files are exceptions, as are direct Windows API uses by IO/ itself."
    why: "Bypassing the provider chain skips archive/pak resolution, mod remapping, hot reload, dependency tracking, and DirectStorage optimisation. Every subsystem reinventing its own loader guarantees divergence and duplicate caches."
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15

  - pattern: immediate_gpu_resource_release_on_reload
    status: active
    description: "When a GPU-backed asset (texture, mesh, buffer) is reloaded or unrefed, the underlying ID3D12Resource must enter a deferred-release quarantine of at least swap-chain-depth frames (≥ 3) before actual destruction. Do not Release / Destroy the resource synchronously at reload time or at last ref drop."
    why: "GPU command lists in flight may still reference the old resource. Releasing it before the GPU is done reading causes undefined behaviour (corruption on NVIDIA, crashes on AMD, invisible flicker on Intel). The quarantine aligns destruction with a fence signal from a frame that definitely no longer uses the resource."
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15

  - pattern: manual_resource_barrier
    status: active
    description: "Render passes must not emit ID3D12GraphicsCommandList::ResourceBarrier calls directly. All resource transitions come from FrameGraph's automatic emission based on the pass's declared Read/Write handles. Manual barriers bypass the graph's correctness model."
    why: "Manual barriers are the #1 source of DX12 correctness bugs (forgotten transitions, over-transitions, wrong before/after states). FrameGraph's model is only correct if it has full visibility of resource usage — manual emissions silently diverge from the graph's bookkeeping, causing invalid state tracking for downstream passes."
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15

  - pattern: dynamic_resolution_on_ui_targets
    status: active
    description: "DynamicResolution scales only the main 3D render targets (GBuffer, transparent buffer, scene-colour fp16). UI, text, and full-screen PostFX that need exact pixels (FilmGrain, ChromaticAberration) run at native resolution. Tone-map upsamples the scaled scene before UI composite."
    why: "Scaling UI/text causes readability regressions and breaks hit-testing / layout assumptions. FilmGrain and ChromaticAberration assume per-pixel sampling patterns; scaling them produces wrong visual frequency."
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15

  - pattern: raw_physics_body_pointer_in_ecs
    status: active
    description: "ECS components must not hold raw pointers to physics bodies (RigidBody*, btCollisionObject*, etc.). All physics-body references in ECS components are gx::BodyHandle (opaque 32-idx + 32-gen). The PhysicsWorld owns the bodies; the ECS just refers to them."
    why: "Raw pointers become dangling when the PhysicsWorld recompacts its body storage or when a body is removed from script. BodyHandle's generation counter detects use-after-remove and returns a safe null result instead of crashing."
    adr: docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15

  - pattern: variable_timestep_in_physics_solver
    status: active
    description: "Physics solver iteration must run on a fixed timestep (default 1/60 s). Do not pass a variable wall-clock dt into the integrator. PhysicsWorld accumulates the render-side delta and runs whole fixed steps; leftover time is the render interpolation factor."
    why: "Variable dt breaks determinism (required for replay / save-load), destabilises sequential-impulse solvers at low FPS, and causes cloth/ragdoll explosions when a spike delays a frame. Fixed step + accumulator is the standard solution and is what the solver's convergence analysis assumes."
    adr: docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15

  - pattern: mid_step_physics_mutation
    status: active
    description: "Do not call AddBody / RemoveBody / AddConstraint / RemoveConstraint during PhysicsWorld::Step execution. Mutations from gameplay code or Lua are queued in a command buffer and flushed at the start of the next step — or executed on the main thread between steps."
    why: "Mid-step mutations invalidate the broadphase tree and constraint island bookkeeping, causing crashes or silently dropped contacts. Deferred mutation preserves solver invariants without requiring per-call locks in the hot path."
    adr: docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15

  - pattern: heap_allocation_on_audio_callback
    status: active
    description: "Code executing on the XAudio2 callback thread (DSP effects, voice callbacks, mixer tick) must not allocate from the heap (no new/delete/malloc/free, no std::string growth, no std::vector push_back without a pre-reserved capacity). Parameter updates from the main thread use atomic double-buffered structures; the audio thread only reads."
    why: "Heap allocation under the audio callback causes lock contention with the general allocator and unbounded latency, which leads to audible buffer underruns (crackles, stutters). Double-buffered params give the main thread a way to publish changes without blocking the callback."
    adr: docs/architecture/adr-0010-audio-architecture.md
    added: 2026-04-15

  - pattern: occlusion_raycast_over_budget
    status: active
    description: "Audio occlusion raycasts per emitter must not exceed 10 Hz. Raycasts across all emitters are staggered to spread load, and submitted to JobSystem in batches. The entire occlusion feature can be disabled globally on low-end configs via AudioOcclusion::SetEnabled(false)."
    why: "A scene with 256 emitters occluding at render rate would consume the entire physics raycast budget (ADR-0009) and starve gameplay queries. Rate-limiting + staggering keeps audio occlusion a minor cost (≤ 0.2 ms/frame) rather than a dominant one."
    adr: docs/architecture/adr-0010-audio-architecture.md
    added: 2026-04-15

  - pattern: cross_thread_input_read
    status: active
    description: "InputManager and its per-device classes (Keyboard, Mouse, Gamepad, IMEHandler) are read-only-safe from the main thread only. Worker-thread code must not call IsPressed / GetMousePoint / GetStick / GetCompositionText. Pass a snapshot down or marshal back via JobSystem::SubmitMainThread."
    why: "Input state is mutated inside InputManager::Update() on the main thread without locks. Cross-thread reads observe partially-updated state (torn writes on edge counters, half-flushed wheel accumulator) and break ActionMapping's guarantees. Single-thread ownership is the cheapest correctness story."
    adr: docs/architecture/adr-0011-input-architecture.md
    added: 2026-04-16

  - pattern: private_input_thread
    status: active
    description: "Input subsystem code must not spawn its own message-pump thread or polling thread. InputManager hooks into Window::AddMessageProc and runs Update() from the application's main loop. Gamepad polling happens inside Update(), not on a background thread."
    why: "A private input thread fragments the OS message pump, races with WndProc message dispatch, and breaks IME (IMM32 messages must arrive on the window's owning thread). It also defeats the deterministic insertion point needed for future replay/netcode IInputSource indirection."
    adr: docs/architecture/adr-0011-input-architecture.md
    added: 2026-04-16

  - pattern: direct_imgui_focus_steal
    status: active
    description: "Game code and the retained UIContext must not bypass ImGui's input-capture flags. Before consuming a click or keypress, check ImGui::GetIO().WantCaptureMouse / WantCaptureKeyboard (via ImGuiManager::IsCapturing()) and yield if true. Conversely, ImGui usage must not directly mutate UIContext focus."
    why: "ImGui maintains its own focus state machine; bypassing the WantCapture flags causes double-handling (click registers in both stacks) and visible focus desyncs. The priority order ImGui → UIContext → game is the only contract that keeps both stacks coherent."
    adr: docs/architecture/adr-0012-gui-architecture.md
    added: 2026-04-16

  - pattern: nondeterministic_in_rollback_gameplay
    status: active
    description: "Gameplay code reachable during the rollback re-simulation window must not call time(NULL), gettimeofday, std::random_device, std::rand, or iterate hash containers (std::unordered_*, gx::HashMap) where iteration order affects state. Use the replicated gx::Random seed for any randomness; use gx::VectorMap or archetype iteration for deterministic ordering. Fast-math compiler flags are disabled in physics + rollback translation units."
    why: "RollbackNetcode rewinds and re-simulates frames with the corrected opponent input. If gameplay logic produces different output for identical inputs (because a hash iteration changes order, or a random uses a fresh seed), the re-simulated state diverges from the original, breaking the rollback contract and producing visible desync. Determinism is the load-bearing assumption."
    adr: docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16

  - pattern: raw_pointer_in_replication_payload
    status: active
    description: "Replication payloads (ReplicatedProperty values, RPC arguments, snapshot deltas) must not contain raw pointers, std::shared_ptr, or any address-shaped reference. Entity references on the wire are gx::EntityHandle (idx32+gen32, ECS opaque per ADR-0004); asset references are gx::AssetId (FNV-1a 64 per ADR-0007); physics body references are gx::BodyHandle. Pointer addresses are not stable across processes or even across runs of the same process."
    why: "Sending a pointer over the network is undefined-behaviour-shaped: the remote process has no mapping; address-space layout randomisation guarantees the address is meaningless; even a same-machine peer will not have the same heap layout. Stable opaque identifiers are the only correct cross-process reference shape."
    adr: docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16

  - pattern: nondeterministic_reduction_in_rollback_physics_stage
    status: active
    description: "Physics solver code reachable inside the rollback re-simulation window must not perform shared-accumulator reductions whose result depends on completion order. Island solve writes per-island into pre-allocated slots indexed by deterministic island-ID; final merge runs on the main thread after a barrier in ascending island-ID order. No std::atomic<float> add, no parallel-reduce-into-shared, no Job-completion-order-dependent state mutation. Floating-point fast-math (/fp:fast, -ffast-math) is disabled in physics + rollback translation units; compiler flag drift is treated as a build break."
    why: "Work-stealing schedulers (per ADR-0006) make Job completion order nondeterministic by design. ADR-0013 rollback re-runs PhysicsWorld::Step expecting byte-identical state across runs and across CPUs (AMD vs Intel); any reduction whose result depends on the order summands arrive in will silently desync rollback. ADR-0009 §15 codifies the deterministic-merge pattern; this pattern bans the failure mode."
    adr: docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-16

  - pattern: wall_clock_dt_in_animation_tick
    status: active
    description: "Code reachable inside Animator::Update / AnimationLayer evaluation / IK solve / MotionMatching / SpringBone step / ProceduralAnimation overlays must not read wall-clock time (Time::DeltaTime, std::chrono::steady_clock::now, QueryPerformanceCounter for dt). The dt parameter passed to the animation tick is the fixed timestep (per ADR-0009) — use only that. Rendering interpolation factor for smooth visuals is computed outside the animation tick and applied at the render side."
    why: "ADR-0013 RollbackNetcode re-simulates the animation tick during rollback re-runs. If animation reads wall-clock time, the same input produces different poses on rewind (the wall clock advanced), breaking byte-identical rollback. The fixed-dt-in / interpolation-out separation per ADR-0009 §15 is the only correct shape for rollback-safe animation."
    adr: docs/architecture/adr-0014-animation-pipeline.md
    added: 2026-04-16

  - pattern: skeleton_as_ecs_component
    status: active
    description: "gx::Skeleton (bone hierarchy with parent indices, bind pose matrices, humanoid mapping) must NOT be stored as an ECS component. ECS components are POD per ADR-0004 forbidden_pattern virtual_or_inherited_ecs_component; Skeleton's hierarchical pointer-rich shape doesn't fit. ECS holds only an opaque AssetHandle<Skeleton> on a component; the Skeleton resource lives in the Animation module and is shared across Animator instances."
    why: "Decomposing Skeleton into per-bone ECS components explodes query cost (15 entities per humanoid character) and forces polymorphism for state-machine / blend-tree node types that fights ECS's flat archetype storage. The handle-from-ECS escape hatch (matching ADR-0009 BodyHandle) is the established pattern for non-POD subsystem state."
    adr: docs/architecture/adr-0014-animation-pipeline.md
    added: 2026-04-16

  - pattern: internal_only_extension_point
    status: active
    description: "Any extension point intended for Layer 2 users (custom render pass, custom shader, custom MaterialDomain, custom audio DSP effect, custom asset provider, custom physics shape, custom widget, custom IFileProvider) MUST NOT live under detail:: namespace, in *_internal.h header, or behind a friend class declaration. If it's an extension point, it's public, headers-installed, and Doxygen-documented per ADR-0017 L2.1/L2.3/L2.4."
    why: "ADR-0017 commits the SDK to a two-layer accessibility pillar — Layer 1 beginners + Layer 2 motivated users who modify the core. Hiding extension points behind detail:: kills the Layer 2 promise. Users hit a wall the moment they try to extend, fork the engine, and the SDK loses its identity."
    adr: docs/architecture/adr-0017-two-layer-accessibility-pillar.md
    added: 2026-04-16

  - pattern: undocumented_layer1_api
    status: active
    description: "Public functions in gx:: namespace exposed via the Compat layer (Compat_*.cpp / GXLib.h / GX/*.h) MUST have a Doxygen /// block including: brief description, return value semantics, one usage example. Empty comments, single-line bare descriptions, and autogenerated boilerplate are forbidden. Per ADR-0017 L1.4."
    why: "Layer 1 beginners discover the API by reading headers — no other channel exists for them. Empty docs force them to read the implementation, which defeats the beginner-usable promise. The Compat layer is the SDK's selling point and must be self-documenting."
    adr: docs/architecture/adr-0017-two-layer-accessibility-pillar.md
    added: 2026-04-16

  - pattern: silent_failure_in_compat_layer
    status: active
    description: "Compat layer functions returning int MUST return -1 on failure AND log a human-readable error via gx::Logger / GX_LOG_ERROR with at least the function name and the input that failed (e.g., file path, asset id). Returning -1 silently with no log entry is forbidden — Layer 1 users cannot diagnose engine internals. Functions returning void on failure paths must also log. Per ADR-0017 L1.3."
    why: "Beginners hit failures (file not found, GPU init quirk, asset format mismatch) and have no way to diagnose them if the engine returns silently. They see a black window and give up. A single GX_LOG_ERROR line transforms a frustrating dead-end into a search-engine-able message."
    adr: docs/architecture/adr-0017-two-layer-accessibility-pillar.md
    added: 2026-04-16

  - pattern: layer1_breaking_change_without_compat_shim
    status: active
    description: "Renaming, removing, or signature-changing a Layer 1 procedural function (anything in gx:: Compat layer that mirrors a DXLib name OR is documented as Layer 1 in the SDK headers) requires either: (a) keeping the old function as a thin shim with [[deprecated]] attribute pointing at the new name, OR (b) a major version bump documented in CHANGELOG.md with a complete migration table from old name → new name. Per ADR-0017 L1 stability requirement."
    why: "Layer 1 stability is GXLib's selling point — DXLib porting + lifelong stability of the procedural surface. A free hand to rename / remove these functions silently breaks user code on engine update and turns the SDK into 'just another moving target'. Shim + deprecate is the documented escape hatch."
    adr: docs/architecture/adr-0017-two-layer-accessibility-pillar.md
    added: 2026-04-16

  - pattern: tcp_for_realtime_gameplay
    status: active
    description: "Real-time gameplay traffic (input streams, snapshots, world state replication, RPCs delivered every tick) must use UDPSocket + ReliableChannel, not TCPSocket. TCP is reserved for matchmaking (HTTPS), cloud save (HTTPS), HTTP services, and pre-game session setup."
    why: "TCP head-of-line blocking stalls all subsequent packets when one is lost — fatal for a 30/60 Hz gameplay tick. ReliableChannel's ACK-bitfield model lets gameplay continue past lost packets while still recovering them, and lets you mix reliable and unreliable traffic on one channel. TCP is the wrong abstraction for real-time games even though it sounds simpler."
    adr: docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16

  - pattern: widget_mutation_off_main_thread
    status: active
    description: "gx::GUI::Widget tree mutations (SetRoot, AddChild, RemoveChild, SetStyle, property writes, DataBinding subscribe/unsubscribe, UITween::Play) must happen on the main thread only. Worker-thread code marshals via JobSystem::SubmitMainThread."
    why: "UIContext::Update reads and mutates the widget tree without locks. Cross-thread mutation tears the tree mid-layout, corrupts focus pointers, and races DataBinding notification queues. Single-thread ownership matches the rendering and input-handling contracts."
    adr: docs/architecture/adr-0012-gui-architecture.md
    added: 2026-04-16

  - pattern: touch_as_first_class_input
    status: active
    description: "GXLib/Input/TouchInput is a stub. Game code and engine subsystems must not depend on touch input as a first-class input source. UI consumers may not assume touch events. A future ADR superseding this rule is required to elevate touch."
    why: "Touch is not currently a supported scope (Windows desktop / gamepad / K+M only per technical-preferences.md). Building features on the stub gives a false sense of coverage and creates silent breakage when the stub is later replaced with a real backend."
    adr: docs/architecture/adr-0011-input-architecture.md
    added: 2026-04-16

