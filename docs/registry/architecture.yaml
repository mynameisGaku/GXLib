# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: project_documentation_strategy
    status: active
    api: "ADR-only (docs/architecture/adr-*.md) + Doxygen in headers"
    not: "GDD-driven workflow (design/gdd/*.md)"
    adr: docs/architecture/adr-0001-documentation-strategy.md
    reason: "GXLib is a game engine SDK, not a game. GDD vocabulary (Player Fantasy, Tuning Knobs, Acceptance Criteria as gameplay) does not apply to API design."
    referenced_by:
      - docs/architecture/adr-0001-documentation-strategy.md
    added: 2026-04-15
    revised: ""

  - purpose: rendering_backend
    status: active
    api: "DirectX 12 (Feature Level 12_1 min, 12_2 where available), DXC + HLSL 6.x"
    not: "DirectX 11, Vulkan, dual-backend abstraction"
    adr: docs/architecture/adr-0002-dx12-backend-choice.md
    reason: "DXLib's DX11 heritage blocks modern GPU features (HDR, VRS, Mesh Shaders, Sampler Feedback, DirectStorage, DXR). Windows-only scope means Vulkan offers no portability benefit and weaker Windows feature maturity."
    referenced_by:
      - docs/architecture/adr-0002-dx12-backend-choice.md
    added: 2026-04-15
    revised: ""

  - purpose: public_procedural_api
    status: active
    api: "namespace gx:: free functions with DXLib-shaped names (DrawGraph, DrawString, LoadGraph, LoadSoundMem, etc.); int return codes (0 success, -1 failure); GX_Init()/GX_End()/ProcessMessage() for lifecycle"
    not: "global-namespace DXLib symbols, DxLib_Init / DxLib_End verbatim, exception-based error reporting across the Compat boundary"
    adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    reason: "Namespace scoping prevents ODR clashes when a user links both DxLib and GXLib during a porting transition, and makes call-site intent explicit in reviews. DXLib-shaped names minimise porting effort for existing DXLib users."
    referenced_by:
      - docs/architecture/adr-0003-dxlib-compat-api-layer.md
    added: 2026-04-15
    revised: ""

  - purpose: ecs_layout
    status: active
    api: "Archetype-based ECS (GXLib/ECS/): entities with identical component sets share an Archetype; each archetype owns contiguous SoA ComponentStorage arrays. Entity = 32-bit index + 32-bit generation. Query<Cs...>() walks matching archetypes."
    not: "sparse-set ECS (EnTT-style), pure-OOP replacement of ECS, inheritance-based components"
    adr: docs/architecture/adr-0004-ecs-architecture.md
    reason: "GXLib's target workloads (particles, AI, projectiles) query 3–5 components per system. Archetype SoA iteration is faster than sparse-set in that regime, and the structural-change cost is accepted as a deferred command-buffer operation."
    referenced_by:
      - docs/architecture/adr-0004-ecs-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: scripting_language
    status: active
    api: "Lua 5.4 (single embedded scripting language), sol2 3.x for C++ bindings, one sol::state per script context, path-restricted I/O via gxlib.io, sandbox-by-default (explicit allowlist of stdlib functions)"
    not: "LuaJIT (Lua 5.1 semantics), hand-rolled Lua C API bindings, multi-language scripting (no C#/Python/JS alongside Lua), raw Lua file I/O via io.open"
    adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    reason: "Lua 5.4's integer type and to-be-closed variables, plus timing predictability (no JIT warm-up), suit the glue-logic role better than LuaJIT's throughput. sol2 gives header-only type-safe bindings without hand-rolled stack manipulation. One scripting language keeps the binding surface maintainable."
    referenced_by:
      - docs/architecture/adr-0005-lua-scripting-boundary.md
    added: 2026-04-15
    revised: ""

  - purpose: script_facade_surface
    status: active
    api: "Curated gxlib.* namespaces visible to scripts: gxlib.world, gxlib.draw, gxlib.audio, gxlib.input, gxlib.events, gxlib.physics, gxlib.gui, gxlib.io. Component types become script-visible only via explicit sol::usertype<T> registration in GXLib/Script/ScriptBindings.cpp."
    not: "raw GraphicsDevice / ID3D12Device / internal archetype pointers / detail:: namespace types exposed to Lua"
    adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    reason: "A curated facade decouples script authoring from engine internals — C++ can refactor private layout freely as long as the gxlib.* surface is preserved. Explicit binding registration keeps new components C++-only by default, preventing accidental leak of engine internals to untrusted mod code."
    referenced_by:
      - docs/architecture/adr-0005-lua-scripting-boundary.md
    added: 2026-04-15
    revised: ""

  - purpose: task_scheduler
    status: active
    api: "gx::JobSystem singleton + task-stealing (Chase-Lev) deques. Fixed worker count = hardware_concurrency()-1 by default. Three priority tiers (High/Normal/Low), graph-shaped dependencies via SubmitAfter(dep(s), fn), ParallelFor for embarrassingly-parallel loops, SubmitMainThread for thread-affine work. Cooperative Wait (workers help drain)."
    not: "OS ThreadPool (Windows CreateThreadpoolWork), fiber-based schedulers, std::async-per-call, single shared MPMC queue, subsystems spawning their own std::thread pools, preemptive priority"
    adr: docs/architecture/adr-0006-job-system-architecture.md
    reason: "Work-stealing scales near-linearly for game workloads above ~4 cores while OS pools and single-queue designs do not. Fibers introduce MSVC debugger / TLS / DX12 command-list affinity problems that outweigh their nested-parallelism elegance. One shared scheduler prevents oversubscription when 5+ subsystems each want to parallelise."
    referenced_by:
      - docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: asset_identity
    status: active
    api: "AssetId = 64-bit FNV-1a hash of normalised logical path (forward slashes, lowercase, no extension unless needed for disambiguation). Addressable via typed constants from a generated asset-ID header built from the project manifest."
    not: "std::string paths passed through code, relative or absolute filesystem paths hardcoded in source, per-subsystem identity schemes, cryptographic hashes (unnecessary for the use case)"
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    reason: "Stable hashed IDs survive rename, rebuild, and archive repackaging. Decoupling source from on-disk layout lets shipping repackage assets into .pak / .gxa without touching code. FNV-1a is fast and collision rate over a single game's asset set is negligible — collisions are detected at insert time."
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - purpose: asset_loading
    status: active
    api: "AssetDatabase::Get<T>(AssetId) for sync; AsyncLoader::LoadAsync<T>(AssetId) submits to JobSystem; bytes flow through priority-ordered IFileProvider chain (Physical→Archive→Pak→Bundle), with AssetRemapper overrides ahead of the chain for mod support. DirectStorageManager is used for GPU-bound assets when hardware supports it; automatic fallback to ReadFile+staging upload otherwise."
    not: "per-subsystem load logic (TextureManager::Load, SoundManager::Load each opening files directly), synchronous blocking loads on the main thread for large assets, DirectStorage-required (no fallback)"
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    reason: "One load path makes caching, hot reload, dependency tracking, and mod support tractable. Per-subsystem managers duplicate all of these and silently diverge. DirectStorage fallback is mandatory because not all consumer hardware supports it — ADR-0002 commits to running on minimum-spec."
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - purpose: rendering_pipeline
    status: active
    api: "Hybrid Deferred + Forward+ with shared clustered lighting. MaterialDomain enum routes: Opaque→Deferred, Transparent/Cutout/Decal/Particle→Forward+. Both paths sample the same per-frame cluster grid (Graphics/3D/ClusteredLighting). 2D/UI/Text runs after SDR composition in a separate FrameGraph pass."
    not: "Pure Deferred (transparency suffers), Pure Forward+ (opaque-dense scenes too expensive), Visibility Buffer / GPU-driven single-pass (not on current hardware floor), per-material ad-hoc pipeline branches"
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    reason: "Material diversity + dense-opaque performance forces hybrid. Shared clustered light list prevents lighting mismatch at material boundaries. Routing is a data property of the material, not a runtime branch in the shade path."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - purpose: gbuffer_layout
    status: active
    api: "4 RTs: RT0 Albedo (RGB8)+MatID (A8); RT1 Normal octahedral (RGB10A2)+Roughness; RT2 Metallic+AO+Emissive mask+MotionVector packed; RT3 Depth (D32_FLOAT separate). Fixed layout."
    not: "dynamic GBuffer layout per material, adding a 5th RT without an ADR supersede, storing unpacked normals or unpacked motion vectors"
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    reason: "Fixed layout lets every consumer (SSAO, decals, deferred shade, post-processing) assume RT bindings. Octahedral + packing keep bandwidth affordable at 1080p+ on mid-range GPUs. Changing the layout is a breaking change that must supersede this ADR."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - purpose: postfx_chain_order
    status: active
    api: "Fixed canonical PostFX order on linear fp16 scene colour: AutoExposure → DoF → MotionBlur → Bloom → LensFlare → ChromaticAberration → FilmGrain → ColorGrading → Outline → ContactShadows → ToneMap+OutputTransform → SDR UI composite → Present. PostFXMask (bitmask per camera) enables/disables individual effects but NEVER reorders them."
    not: "per-camera reordering of PostFX, ColorGrading before Bloom (breaks HDR-aware grading), ToneMap in the middle of the chain, running PostFX on SDR buffers"
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    reason: "Physically-meaningful PostFX (Bloom samples linear HDR scene; ColorGrading expects linear input) requires a consistent HDR-throughout pipeline. Fixed order makes per-effect behaviour testable and prevents combinatorial QA explosion. Reordering is a supersede-level decision."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - purpose: hdr_workflow
    status: active
    api: "Main scene + PostFX run on R16G16B16A16_FLOAT (linear). Tone-map + output transform at the end selects the swap-chain format at startup: HDR10 (BT.2020 + ST.2084 PQ), scRGB (linear 16-bit), or SDR sRGB (ACES-filmic / Reinhard). Selection is runtime detection via DXGI + user opt-in; SDR is the default to avoid mis-detection."
    not: "SDR-throughout pipeline with a 'make it HDR' filter at the end, auto-enabling HDR on detection without user opt-in, tone-mapping inside individual PostFX effects"
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    reason: "HDR requires linear values throughout for Bloom / DoF / exposure to behave physically. Detecting-but-defaulting-SDR avoids the common bug of apps trying to push HDR to a mis-reporting display and producing washed-out output."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - purpose: physics_backend
    status: active
    api: "Custom in-house physics stack: separate PhysicsWorld2D and PhysicsWorld3D, dynamic AABB-tree broadphase, GJK/EPA narrow-phase (with sphere/box/capsule fast paths), sequential-impulse constraint solver with warm starting + Baumgarte + split-impulse, Verlet cloth, capsule-sweep CharacterController, raycast-wheel VehiclePhysics."
    not: "Jolt Physics, Bullet Physics, NVIDIA PhysX, GPU-accelerated core solver (future ADR), unified 2D-in-3D world"
    adr: docs/architecture/adr-0009-physics-architecture.md
    reason: "The in-house stack already exists (Phases 1/3/5). External engines own their own thread pool (conflicts with ADR-0006 single-scheduler model), require adapter layers for ECS and AssetDatabase integration, and leave 2D uncovered (Jolt/PhysX are 3D-only). Custom stack fits the DXLib-heritage SDK positioning — predictable, small, no external version drift."
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: physics_timestep
    status: active
    api: "Fixed timestep solver loop (default 1/60 s). PhysicsWorld accumulates wall-clock delta and runs whole steps; leftover time produces an interpolation factor for rendering. Users tune step rate via SetTimestep(); variable-dt inside the solver is forbidden."
    not: "variable timestep per frame, substepping based on CPU budget, render-frame-rate-driven physics"
    adr: docs/architecture/adr-0009-physics-architecture.md
    reason: "Fixed timestep is required for deterministic replay / save-load / future networked rollback. Variable dt causes solver drift, cloth explosion at low FPS, and non-reproducible bugs that are painful to debug."
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: audio_backend
    status: active
    api: "XAudio2 (Windows SDK) behind a thin IAudioDevice interface. IXAudio2MasteringVoice is the final mix target. Source voices per active sound; streaming OGG uses a 4×500 ms ring-buffer decoded by JobSystem Low-priority jobs. HRTF / 7.1.4 / head-tracked spatial are out of scope for this ADR."
    not: "WASAPI direct implementation, FMOD Studio integration, Wwise integration, DirectSound (deprecated), OpenAL on Windows"
    adr: docs/architecture/adr-0010-audio-architecture.md
    reason: "XAudio2 is the right abstraction level for game audio on Windows — minimal dependency, no licensing, lifelong Microsoft support. FMOD/Wwise add per-title licensing and ~40-100MB SDK footprint that conflicts with GXLib's minimal-friction positioning. WASAPI direct reinvents XAudio2. Users who want FMOD can layer it on top themselves."
    referenced_by:
      - docs/architecture/adr-0010-audio-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: audio_mixer_topology
    status: active
    api: "Bus hierarchy: Master → {Music, SFX, Voice, Ambient, Reverb-send}. Each non-Master bus carries volume/mute/solo, optional send to Reverb, and an insert chain of ≤4 DSP effects (LowPass/HighPass/Freeverb/Delay/Compressor biquad+feedback). Custom buses via AudioMixer::CreateBus(name, parent). AudioSnapshot captures + blends full mixer state (bus volumes + sends + DSP params)."
    not: "single-fader mixing, flat-routing without bus hierarchy, per-emitter DSP (must live on a bus), unlimited DSP inserts per bus"
    adr: docs/architecture/adr-0010-audio-architecture.md
    reason: "Industry-standard bus-based mixing gives authors the mental model they expect (Master/Music/SFX/Voice). Snapshots make scene-state transitions (menu→game, underwater, combat-duck) authorable as single blends rather than hand-written per-bus tween code. Capping DSP inserts at 4 keeps the mix-thread CPU bounded."
    referenced_by:
      - docs/architecture/adr-0010-audio-architecture.md
    added: 2026-04-15
    revised: ""

  - purpose: two_layer_accessibility_pillar
    status: active
    api: "Every public API addition is reviewed against L1.1–L1.5 (DXLib-shaped procedural call OR gx::App method, sensible defaults, -1 + Logger on failure, Doxygen + example, minimal sample) AND L2.1–L2.5 (extension point public not detail::, in-repo example, override contract documented, transitive types public, modification works as application-side code with no engine recompile)."
    not: "Layer 1 only (DXLib-clone identity); Layer 2 only (pro engine identity, contradicts ADR-0003); pillar as soft guideline (drift-prone, not enforceable)."
    adr: docs/architecture/adr-0017-two-layer-accessibility-pillar.md
    reason: "Project owner explicitly committed both audiences as first-class. Pillar formalises and protects the existing Layer 2 extension points (FrameGraph passes per ADR-0008, AudioDSP::RegisterEffect per ADR-0010, IFileProvider per ADR-0007, Widget derivation per ADR-0012) and prevents future ADRs from quietly hiding extension points. Per-PR checklist + per-release accessibility scorecard turn the pillar from prose into mechanical enforcement."
    referenced_by:
      - docs/architecture/adr-0017-two-layer-accessibility-pillar.md
      - docs/architecture/adr-0003-dxlib-compat-api-layer.md
      - docs/architecture/adr-0008-rendering-pipeline.md
      - docs/architecture/adr-0010-audio-architecture.md
      - docs/architecture/adr-0007-asset-database-hot-reload.md
      - docs/architecture/adr-0012-gui-architecture.md
    added: 2026-04-16
    revised: ""

  - purpose: animation_subsystem
    status: active
    api: "Layered: Skeleton (asset, shared) → Animator (per-instance facade with parameter bag) → AnimatorStateMachine + AnimationLayer[] → BlendTree / BlendStack / direct AnimationClip. Post-pose: IK suite (FootIK → FullBodyIK → LookAtIK via IKSolver CCD/FABRIK) → ProceduralAnimation overlays → SpringBone Verlet step → ECS Transform mirror via EntityBridge → ComputeSkinning compute pass (ADR-0008) → SceneRenderer GBuffer. Alternative top-level driver: MotionMatching pose-feature DB. RootMotionLocomotion drives CharacterController (ADR-0009 §10). Ragdoll handoff via Animator::EnableRagdoll/DisableRagdoll."
    not: "Ozz-animation / ACL as runtime (greenfield-only); Skeleton-as-ECS-components (POD violation); CPU-skinning-only (perf cliff at 50+ skinned characters); animation reading wall-clock dt during rollback window."
    adr: docs/architecture/adr-0014-animation-pipeline.md
    reason: "In-house stack already exists across Phases 0/1/3 and integrates natively with ECS / AssetDB / Job System / FrameGraph. Layered design lets gameplay use the highest level it needs (Animator parameter bag) without losing access to lower primitives (raw clip playback). IK suite + motion matching + spring bones cover the common animation-quality features without per-game implementation. Determinism contract (fixed dt, no fast-math, deterministic IK seed) makes animation rollback-safe per ADR-0013."
    referenced_by:
      - docs/architecture/adr-0014-animation-pipeline.md
      - docs/architecture/adr-0008-rendering-pipeline.md
      - docs/architecture/adr-0009-physics-architecture.md
      - docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16
    revised: ""

  - purpose: networking_stack
    status: active
    api: "Layered: UDPSocket / TCPSocket / TLSSocket / WebSocket / HTTPClient (Winsock2 + Schannel) → ReliableChannel (ACK bitfield + retransmit + RTT) → NetworkManager (server/client + RPC) → NetworkReplicator + ReplicatedProperty<T> (ECS-integrated) → InterestManagement → NetworkPrediction + RollbackNetcode → NATTraversal + MatchmakingLobby → CloudSave."
    not: "Photon / Mirror / GameNetworkingSockets / ENet (third-party netcode); TCP-only stack (head-of-line blocking); pure peer-to-peer lockstep without server-authoritative option; rollback-less prediction-only model; private network thread pool (use Job System per ADR-0006)."
    adr: docs/architecture/adr-0013-networking-architecture.md
    reason: "Native ECS integration via ReplicatedProperty<T> lets authors mark a field once and replication just works. UDP + ACK-bitfield reliability is required for real-time gameplay (TCP HOL blocking is fatal). Rollback unlocks fighting / racing / fast PvP genres at the cost of binding determinism rules onto gameplay code. Layered design lets each level swap independently. Job System integration keeps networking work scaling without a private thread pool."
    referenced_by:
      - docs/architecture/adr-0013-networking-architecture.md
      - docs/architecture/adr-0004-ecs-architecture.md
      - docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-16
    revised: ""

  - purpose: gui_architecture
    status: active
    api: "Two parallel UI stacks: gx::GUI (retained tree — UIContext + Widget hierarchy + XML/CSS layout via GUILoader/StyleSheet + DataBinding + UITween) for shipping game UI, and gx::ImGuiManager (Dear ImGui via imgui_impl_dx12 + imgui_impl_win32) for editor/debug UI. Per-frame input ownership priority: ImGui (WantCapture flags) → UIContext (Capture/Target/Bubble dispatch) → game code (InputManager queries)."
    not: "Single unified stack (immediate-mode-only or retained-only); RmlUi / Noesis / Coherent backend; ImGui as a child widget inside UIContext (focus model conflict)."
    adr: docs/architecture/adr-0012-gui-architecture.md
    reason: "Game UI needs declarative XML/CSS authoring + animation + data binding (retained); editor/debug UI needs immediate-mode productivity + the ImGuizmo/ImNodes/ImPlot ecosystem (ImGui). The two stacks coexist via a deterministic input-priority contract that respects ImGui's documented WantCapture flags. UIRenderer composites at native resolution after PostFX (per ADR-0008 dynamic_resolution_on_ui_targets); ImGui draws last before Present."
    referenced_by:
      - docs/architecture/adr-0012-gui-architecture.md
      - docs/architecture/adr-0008-rendering-pipeline.md
      - docs/architecture/adr-0011-input-architecture.md
    added: 2026-04-16
    revised: ""

  - purpose: input_backend
    status: active
    api: "InputManager + Keyboard + Mouse + Gamepad (XInput) + IMEHandler (IMM32) + ActionMapping; hooked into Window::AddMessageProc"
    not: "DInput; Raw Input (WM_INPUT); SDL/GLFW/SDL_GameController; private input thread; flat DXLib-style globals (those exist only in the gx:: Compat layer over this stack)"
    adr: docs/architecture/adr-0011-input-architecture.md
    reason: "Single per-Window facade aggregates per-device classes giving modern semantics (edges, durations, analog) that DXLib lacks, while the Compat layer (ADR-0003) reproduces the DXLib procedural surface verbatim. XInput is sufficient for the Xbox-shaped controllers that dominate Windows gaming; IMM32 is the correct API for IME composition; hooking the existing Window message pump avoids a private input thread."
    referenced_by:
      - docs/architecture/adr-0011-input-architecture.md
      - docs/architecture/adr-0003-dxlib-compat-api-layer.md
    added: 2026-04-16
    revised: ""

