# ─── PERFORMANCE BUDGETS ──────────────────────────────────────────────────────
# Frame time allocations per system, against a defined total frame budget.
# Conflicts: allocations that sum to more than the total budget = unshippable.
#
# Register a budget when an ADR explicitly claims a frame time allocation.
# The registry lets /architecture-review verify the total doesn't exceed the target.

performance_budgets:
  - target_fps: 60
    total_frame_budget_ms: 16.6
    platform: PC
    adr: docs/architecture/adr-0002-dx12-backend-choice.md
    added: 2026-04-15
    revised: ""

  - system: ecs-update
    status: active
    budget_ms: 2.0
    adr: docs/architecture/adr-0004-ecs-architecture.md
    notes: "All registered ECS systems combined, at 100k live entities with 4-component query iteration, on mid-range CPU. Includes archetype walk + component access + command-buffer flush; excludes per-system gameplay logic complexity."
    referenced_by:
      - docs/architecture/adr-0004-ecs-architecture.md
    added: 2026-04-15
    revised: ""

  - system: script-execution
    status: active
    budget_ms: 1.0
    adr: docs/architecture/adr-0005-lua-scripting-boundary.md
    notes: "All live Lua scripts combined, per frame at 60 fps. Includes Lua VM execution, sol2 binding calls, and pcall error trapping. Scripts exceeding budget are logged; preemption is cooperative (scripts expected to yield via coroutines for long work)."
    referenced_by:
      - docs/architecture/adr-0005-lua-scripting-boundary.md
    added: 2026-04-15
    revised: ""

  - system: job-system-scheduling
    status: active
    budget_ms: 0.2
    adr: docs/architecture/adr-0006-job-system-architecture.md
    notes: "Scheduler overhead only — time spent in Submit/SubmitAfter/Wait/steal/wake, excluding user job bodies. Target: ~200 jobs/frame + ParallelFor splits. Worker sleep/wake latency ≤ 50 μs via condition variable."
    referenced_by:
      - docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15
    revised: ""

  - system: asset-resolve
    status: active
    budget_ns: 100
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    notes: "Steady-state AssetDatabase::Get<T>(AssetId) call overhead ≤ 100 ns: hashmap lookup + generation check + type-tag cast. Excludes initial load cost (handled by AsyncLoader). AssetHandle<T>::Resolve() on an already-valid handle is likewise ≤ 100 ns."
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - system: clustered-light-build
    status: active
    budget_ms: 0.3
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    notes: "Per-frame ClusteredLighting::BuildLightList for 256 active lights on a 16×9×24 cluster grid, mid-range CPU. Excludes GPU-side cluster fill / sort. Soft cap 512 lights/frame, hard cap 4096."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - system: framegraph-compile
    status: active
    budget_ms: 0.1
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    notes: "Per-frame FrameGraph pass-sort + transient-resource aliasing + barrier emission, for a typical ~20-pass render frame on mid-range CPU. Excludes command-list recording time (parallelised across JobSystem workers)."
    referenced_by:
