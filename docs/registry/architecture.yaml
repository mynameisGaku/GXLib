# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: compat_context_ownership
    status: active
    pattern: shared_resource
    producer: Compat/CompatContext
    consumers:
      - Compat/Compat_2D
      - Compat/Compat_3D
      - Compat/Compat_Font
      - Compat/Compat_Input
      - Compat/Compat_Sound
      - Compat/Compat_System
      - Compat/Compat_Particle
      - Compat/Compat_Math
    adr: docs/architecture/adr-0003-dxlib-compat-api-layer.md
    signal_signature: "gx::CompatContext& gx::GetCompatContext(); (file-static singleton, lazily acquires GraphicsDevice/FontManager/SoundManager/InputManager on first use, releases on GX_End())"
    referenced_by:
      - docs/architecture/adr-0003-dxlib-compat-api-layer.md
    added: 2026-04-15
    revised: ""

  - contract: oop_ecs_entity_bridge
    status: active
    pattern: shared_resource
    producer: ECS/EntityBridge
    consumers:
      - Core/SceneManager (OOP side)
      - ECS/World (ECS side)
    adr: docs/architecture/adr-0004-ecs-architecture.md
    signal_signature: "gx::EntityBridge::Attach(Node*, Entity); bridge mirrors Transform (required) and Lifetime/Tag (optional) between a scene Node and an ECS entity. Single canonical owner per paired entity: Node drives if authored, ECS drives if spawned. Sync runs once per frame at a defined phase — not every mutation."
    referenced_by:
      - docs/architecture/adr-0004-ecs-architecture.md
    added: 2026-04-15
    revised: ""

  - contract: job_submission
    status: active
    pattern: direct_call
    producer: "any subsystem (Graphics, Physics, ECS, IO, AI, Audio, etc.)"
    consumers:
      - Core/JobSystem
    adr: docs/architecture/adr-0006-job-system-architecture.md
    signal_signature: "JobHandle Submit(fn, JobPriority); JobHandle SubmitAfter(dep(s), fn, JobPriority); JobHandle ParallelFor(begin, end, batchSize, fn_i); JobHandle SubmitMainThread(fn). Wait(h) is cooperative — callable from workers, which help drain other work while waiting. Main-thread queue is drained by ProcessMainThreadJobs(budget_ms) — sole path for DX12 swap-chain calls and any Lua state touch."
    referenced_by:
      - docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15
    revised: ""

  - contract: asset_handle
    status: active
    pattern: shared_resource
    producer: Core/AssetDatabase
    consumers:
      - "any subsystem requesting assets (Graphics, Audio, ECS, Lua, Physics, GUI, etc.)"
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    signal_signature: "AssetHandle<T> AssetDatabase::Get<T>(AssetId); future<AssetHandle<T>> LoadAsync<T>(AssetId). Handle carries generation counter; Resolve() returns current T* or nullptr; IsStale() indicates reload since last resolve. Consumers never hold raw pointers across frames."
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - contract: file_provider_chain
    status: active
    pattern: shared_resource
    producer: IO/AsyncLoadPipeline
    consumers:
      - Core/AssetDatabase
      - Core/AssetReloader
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    signal_signature: "IFileProvider { bool Resolves(AssetId); span<byte> ReadSync(AssetId); future<bytes> ReadAsync(AssetId); }. Stacked priority order: PhysicalFileProvider > ArchiveFileProvider > PakFileProvider > BundleManager. AssetRemapper may route AssetId → alternate path ahead of the chain. Dev mode prefers Physical (for hot reload); ship mode prefers Archive/Pak."
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - contract: framegraph_pass_declaration
    status: active
    pattern: direct_call
    producer: "rendering subsystems (Shadow, GBuffer, Deferred shade, Forward+, PostFX, etc.)"
    consumers:
      - Graphics/FrameGraph/FrameGraph
    adr: docs/architecture/adr-0008-rendering-pipeline.md
    signal_signature: "FrameGraph::Pass(name).Read(handle).Write(handle).Execute(fn) — passes declare their resource reads/writes upfront. FrameGraph emits all ResourceBarrier calls automatically, aliases transient resources, culls passes whose outputs are never read, and parallelises recording across JobSystem workers. Command recording is per-worker; submission to ID3D12CommandQueue is main-thread-only (ADR-0006)."
    referenced_by:
      - docs/architecture/adr-0008-rendering-pipeline.md
    added: 2026-04-15
    revised: ""

  - contract: body_handle
    status: active
    pattern: shared_resource
    producer: Physics/PhysicsWorld{2D,3D}
    consumers:
      - "any subsystem referencing physics bodies (ECS RigidBody components, gameplay code, Lua bindings, CharacterController, Ragdoll)"
    adr: docs/architecture/adr-0009-physics-architecture.md
    signal_signature: "gx::BodyHandle = 64-bit opaque (32-bit index + 32-bit generation). Returned by AddBody(BodyDesc); invalidated by RemoveBody. All physics APIs (AddConstraint, Raycast filter, SetVelocity, GetTransform) take BodyHandle — never a raw pointer. Generation detects use-after-remove."
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15
    revised: ""

  - contract: audio_bus
    status: active
    pattern: shared_resource
    producer: Audio/AudioMixer
    consumers:
      - Audio/AudioEmitter
      - Audio/MusicPlayer
      - Audio/AudioSnapshot
      - "gameplay code adjusting volume / mute / solo / DSP params"
    adr: docs/architecture/adr-0010-audio-architecture.md
    signal_signature: "gx::AudioBus carries volume, mute, solo, optional reverb send, and an insert chain of ≤4 DSP effects (LowPass / HighPass / Reverb / Delay / Compressor). Default topology: Master → {Music, SFX, Voice, Ambient}. Reverb is a special send-target bus. AudioManager::GetBus(name) retrieves. Parameter writes are atomic double-buffered; no locks on the XAudio2 callback path."
    referenced_by:
      - docs/architecture/adr-0010-audio-architecture.md
    added: 2026-04-15
    revised: ""

  - name: physics_broadphase_query
    status: active
    pattern: concurrent_versioned_read
    producer: Physics/PhysicsWorld3D (and PhysicsWorld2D)
    consumers:
      - "Physics/PhysicsWorld3D::Raycast / OverlapSphere / ShapeCast"
      - Audio/AudioOcclusion (Job-thread, Normal priority, concurrent with Step)
      - IO/Network/InterestManagement (Job-thread, replication tick, concurrent with Step)
    adr: docs/architecture/adr-0009-physics-architecture.md
    signal_signature: "Read-only queries against the broadphase AABB-tree are safe from any thread at any time, including concurrent with PhysicsWorld::Step. The tree is published copy-on-write — readers acquire the current root pointer atomically and traverse a stable snapshot (prior-frame or current-frame). Mutations remain main-thread or queued via the command buffer that flushes at next-step start. Consumers MUST NOT cache raw node pointers across calls."
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
      - docs/architecture/adr-0010-audio-architecture.md
      - docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16
    revised: ""

  - name: physics_island_solve_reduction_order
    status: active
    pattern: deterministic_barrier_then_serial_merge
    producer: Physics/PhysicsWorld3D (constraint solver)
    consumers:
      - IO/Network/RollbackNetcode (re-simulation must be byte-identical)
      - Core/SaveSystem + ReplaySystem (deterministic replay)
    adr: docs/architecture/adr-0009-physics-architecture.md
    signal_signature: "Island solve runs one Job per island in parallel on JobSystem workers. Each Job writes its solved island state into a pre-allocated slot indexed by deterministic island-ID (lowest-body-id-in-island). After a barrier on all island Jobs, a single main-thread pass merges results in ascending island-ID order. Reduction order is therefore independent of Job completion order, worker thread count, or CPU SKU. Fast-math is disabled in physics solver TUs."
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
      - docs/architecture/adr-0013-networking-architecture.md
    added: 2026-04-16
    revised: ""

