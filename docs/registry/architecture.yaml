# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-04-15"
# 2026-04-15: ADR-0001..ADR-0010 (doc, DX12, Compat, ECS, Lua, Jobs, AssetDB, RenderPipeline, Physics, Audio)

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: graphics_device
    status: active
    owner_system: Graphics/Device
    adr: docs/architecture/adr-0002-dx12-backend-choice.md
    interface: "gx::GraphicsDevice (sole owner of ID3D12Device; non-copyable; accessed via forward-declared handles — no DX12 types in public headers)"
    write_access: graphics-device-only
    referenced_by:
      - docs/architecture/adr-0002-dx12-backend-choice.md
    added: 2026-04-15
    revised: ""

  - state: worker_threads
    status: active
    owner_system: Core/JobSystem
    adr: docs/architecture/adr-0006-job-system-architecture.md
    interface: "gx::JobSystem (singleton; owns all worker threads for the process; fixed count = hardware_concurrency() - 1 by default; workers live for process lifetime, joined on Shutdown)."
    write_access: jobsystem-only
    referenced_by:
      - docs/architecture/adr-0006-job-system-architecture.md
    added: 2026-04-15
    revised: ""

  - state: asset_cache
    status: active
    owner_system: Core/AssetDatabase
    adr: docs/architecture/adr-0007-asset-database-hot-reload.md
    interface: "gx::AssetDatabase (singleton; single process-wide map AssetId → AssetRecord; owns load state, generation counter, ref count, dependency graph). Consumers access via AssetHandle<T>, never via raw pointer across frames."
    write_access: assetdatabase-only
    referenced_by:
      - docs/architecture/adr-0007-asset-database-hot-reload.md
    added: 2026-04-15
    revised: ""

  - state: rigid_body_state
    status: active
    owner_system: Physics/PhysicsWorld{2D,3D}
    adr: docs/architecture/adr-0009-physics-architecture.md
    interface: "gx::PhysicsWorld2D / gx::PhysicsWorld3D own per-body dynamic state (position, orientation, linear/angular velocity, accumulated forces). ECS components hold only opaque BodyHandle (32-bit index + 32-bit generation) plus static metadata (mass, material AssetId). Transforms sync between ECS and PhysicsWorld via EntityBridge at defined frame phase."
    write_access: physicsworld-only
    referenced_by:
      - docs/architecture/adr-0009-physics-architecture.md
    added: 2026-04-15
    revised: ""

